name = "your-worker"
main = "apps/worker-api/src/index.ts"
compatibility_date = "2026-05-01"
workers_dev = true

[vars]
ENVIRONMENT = "local"
LOG_LEVEL = "info"
PROVIDERS_MODE = "mock"
SCHEDULER_ENABLED = "false"
SCHEDULER_DRY_RUN = "true"
SCHEDULER_ALLOW_REAL_PROVIDERS = "false"
SCHEDULER_ALLOW_PUBLISHING = "false"
SCHEDULER_MAX_SOURCES_PER_RUN = "1"
SCHEDULER_MAX_ITEMS_PER_RUN = "2"
MAX_AI_ITEMS_PER_RUN = "0"
MAX_PROVIDER_ITEMS_PER_RUN = "5"
MAX_PUBLISH_ITEMS_PER_RUN = "0"
TELEGRAM_REAL_REVIEW_ENABLED = "false"
TELEGRAM_FINAL_PUBLISH_ENABLED = "false"
TELEGRAM_PUBLISH_SCHEDULER_ENABLED = "false"
TELEGRAM_PUBLISH_DUE_LIMIT = "5"
MEDIA_PROCESSING_MODE = "telegram_file_id_reuse"
GITHUB_MEDIA_PROCESSOR_ENABLED = "false"
GITHUB_MEDIA_PROCESSOR_REPOSITORY = ""
GITHUB_MEDIA_PROCESSOR_WORKFLOW_ID = "media-processor.yml"
GITHUB_MEDIA_PROCESSOR_REF = "main"
GITHUB_MEDIA_PROCESSOR_CALLBACK_URL = ""
TELEGRAM_MEDIA_MAX_PHOTO_MB = "9"
TELEGRAM_MEDIA_MAX_FILE_MB = "49"
MEDIA_MAX_ASSETS = "10"
YTDLP_CONCURRENT_FRAGMENTS = "8"
MEDIA_FASTSTART_COPY = "true"
MEDIA_REVIEW_WAIT_MODE = "all_terminal"
MEDIA_REVIEW_ALLOW_PARTIAL = "false"
MEDIA_FINAL_REQUIRE_READY = "true"
MEDIA_FINAL_ALLOW_TEXT_FALLBACK = "false"
MEDIA_ASPECT_DRIFT_THRESHOLD = "0.02"
MEDIA_FALLBACK_PROVIDER_ENDPOINT = ""
MEDIA_FALLBACK_ENABLED = "true"
MEDIA_FALLBACK_PROVIDER_ORDER_X = "direct,gallery_dl,yt_dlp,external"
MEDIA_FALLBACK_PROVIDER_ORDER_INSTAGRAM = "direct,gallery_dl,instaloader,yt_dlp,external"
MEDIA_GALLERY_DL_ENABLED = "true"
MEDIA_GALLERY_DL_TIMEOUT_SECONDS = "25"
MEDIA_INSTALOADER_ENABLED = "true"
MEDIA_INSTALOADER_TIMEOUT_SECONDS = "30"
MEDIA_VIDEO_OUTPUT_PROFILE = "telegram_review_optimized"
MEDIA_VIDEO_TRANSCODE_POLICY = "copy_if_possible"
MEDIA_MAX_VIDEO_SIDE = "1920"
MEDIA_VIDEO_CRF = "23"
MEDIA_VIDEO_AUDIO_BITRATE = "128k"
TELEGRAM_MEDIA_STAGING_CHAT_ID = ""
TELEGRAM_MEDIA_STAGING_THREAD_ID = ""
TELEGRAM_MEDIA_CACHE_CHAT_ID = ""
TELEGRAM_MEDIA_CACHE_THREAD_ID = ""
WORDPRESS_REAL_DRY_RUN_ENABLED = "false"
WORDPRESS_DEFAULT_STATUS = "draft"

# Local/mock-safe D1 binding. Keep this placeholder for local development.
# Production uses [env.production] below.
[[d1_databases]]
binding = "DB"
database_name = "your_database_name"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "packages/db/migrations"

[env.production]
name = "your-worker"
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
PROVIDERS_MODE = "mock"
SCHEDULER_ENABLED = "false"
SCHEDULER_DRY_RUN = "true"
SCHEDULER_ALLOW_REAL_PROVIDERS = "false"
SCHEDULER_ALLOW_PUBLISHING = "false"
SCHEDULER_MAX_SOURCES_PER_RUN = "1"
SCHEDULER_MAX_ITEMS_PER_RUN = "2"
MAX_AI_ITEMS_PER_RUN = "0"
MAX_PROVIDER_ITEMS_PER_RUN = "5"
MAX_PUBLISH_ITEMS_PER_RUN = "0"
TELEGRAM_REAL_REVIEW_ENABLED = "false"
TELEGRAM_FINAL_PUBLISH_ENABLED = "false"
TELEGRAM_PUBLISH_SCHEDULER_ENABLED = "false"
TELEGRAM_PUBLISH_DUE_LIMIT = "5"
MEDIA_PROCESSING_MODE = "telegram_file_id_reuse"
GITHUB_MEDIA_PROCESSOR_ENABLED = "false"
GITHUB_MEDIA_PROCESSOR_REPOSITORY = ""
GITHUB_MEDIA_PROCESSOR_WORKFLOW_ID = "media-processor.yml"
GITHUB_MEDIA_PROCESSOR_REF = "main"
GITHUB_MEDIA_PROCESSOR_CALLBACK_URL = ""
TELEGRAM_MEDIA_MAX_PHOTO_MB = "9"
TELEGRAM_MEDIA_MAX_FILE_MB = "49"
MEDIA_MAX_ASSETS = "10"
YTDLP_CONCURRENT_FRAGMENTS = "8"
MEDIA_FASTSTART_COPY = "true"
MEDIA_REVIEW_WAIT_MODE = "all_terminal"
MEDIA_REVIEW_ALLOW_PARTIAL = "false"
MEDIA_FINAL_REQUIRE_READY = "true"
MEDIA_FINAL_ALLOW_TEXT_FALLBACK = "false"
MEDIA_ASPECT_DRIFT_THRESHOLD = "0.02"
MEDIA_FALLBACK_PROVIDER_ENDPOINT = ""
MEDIA_FALLBACK_ENABLED = "true"
MEDIA_FALLBACK_PROVIDER_ORDER_X = "direct,gallery_dl,yt_dlp,external"
MEDIA_FALLBACK_PROVIDER_ORDER_INSTAGRAM = "direct,gallery_dl,instaloader,yt_dlp,external"
MEDIA_GALLERY_DL_ENABLED = "true"
MEDIA_GALLERY_DL_TIMEOUT_SECONDS = "25"
MEDIA_INSTALOADER_ENABLED = "true"
MEDIA_INSTALOADER_TIMEOUT_SECONDS = "30"
MEDIA_VIDEO_OUTPUT_PROFILE = "telegram_review_optimized"
MEDIA_VIDEO_TRANSCODE_POLICY = "copy_if_possible"
MEDIA_MAX_VIDEO_SIDE = "1920"
MEDIA_VIDEO_CRF = "23"
MEDIA_VIDEO_AUDIO_BITRATE = "128k"
TELEGRAM_MEDIA_STAGING_CHAT_ID = ""
TELEGRAM_MEDIA_STAGING_THREAD_ID = ""
TELEGRAM_MEDIA_CACHE_CHAT_ID = ""
TELEGRAM_MEDIA_CACHE_THREAD_ID = ""
WORDPRESS_REAL_DRY_RUN_ENABLED = "false"
WORDPRESS_DEFAULT_STATUS = "draft"

[[env.production.d1_databases]]
binding = "DB"
database_name = "your_database_name"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "packages/db/migrations"

# Optional future bindings, intentionally commented until real Cloudflare resources exist.
# [[queues.producers]]
# binding = "PUBLISH_QUEUE"
# queue = "your-worker-publish"
#
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "your-worker-media"

[triggers]
# Mock-safe scheduled poller. It uses mock providers by default and does not call external APIs.
crons = ["*/30 * * * *"]

[env.staging]
name = "your-worker"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "info"
PROVIDERS_MODE = "mock"
SCHEDULER_ENABLED = "false"
SCHEDULER_DRY_RUN = "true"
SCHEDULER_ALLOW_REAL_PROVIDERS = "false"
SCHEDULER_ALLOW_PUBLISHING = "false"
SCHEDULER_MAX_SOURCES_PER_RUN = "1"
SCHEDULER_MAX_ITEMS_PER_RUN = "2"
MAX_AI_ITEMS_PER_RUN = "0"
MAX_PROVIDER_ITEMS_PER_RUN = "5"
MAX_PUBLISH_ITEMS_PER_RUN = "0"
TELEGRAM_REAL_REVIEW_ENABLED = "true"
# SAFETY: Keep TELEGRAM_FINAL_PUBLISH_ENABLED=false in staging to prevent accidental real publishing.
# Set to "true" only after explicit manual verification of routes and final channel config.
TELEGRAM_FINAL_PUBLISH_ENABLED = "false"
TELEGRAM_PUBLISH_SCHEDULER_ENABLED = "false"
TELEGRAM_PUBLISH_DUE_LIMIT = "5"
MEDIA_PROCESSING_MODE = "github_actions"
GITHUB_MEDIA_PROCESSOR_ENABLED = "true"
# Set this to your actual GitHub repo, e.g. "thesol-ai/ai-curation-publisher-agent-main"
GITHUB_MEDIA_PROCESSOR_REPOSITORY = ""
GITHUB_MEDIA_PROCESSOR_WORKFLOW_ID = "media-processor.yml"
GITHUB_MEDIA_PROCESSOR_REF = "main"
# Set this to your staging Worker URL + /internal/media/processing/callback
# e.g. "https://<staging-worker>.workers.dev/internal/media/processing/callback"
# Alternatively set WORKER_PUBLIC_BASE_URL and leave this blank.
GITHUB_MEDIA_PROCESSOR_CALLBACK_URL = ""
# Required: staging Worker public base URL for building callback URLs automatically.
# e.g. "https://<staging-worker>.workers.dev"
WORKER_PUBLIC_BASE_URL = ""
TELEGRAM_MEDIA_MAX_PHOTO_MB = "9"
TELEGRAM_MEDIA_MAX_FILE_MB = "49"
MEDIA_MAX_ASSETS = "10"
YTDLP_CONCURRENT_FRAGMENTS = "8"
MEDIA_FASTSTART_COPY = "true"
MEDIA_REVIEW_WAIT_MODE = "all_terminal"
MEDIA_REVIEW_ALLOW_PARTIAL = "false"
MEDIA_FINAL_REQUIRE_READY = "true"
MEDIA_FINAL_ALLOW_TEXT_FALLBACK = "false"
MEDIA_ASPECT_DRIFT_THRESHOLD = "0.02"
MEDIA_FALLBACK_PROVIDER_ENDPOINT = ""
MEDIA_FALLBACK_ENABLED = "true"
MEDIA_FALLBACK_PROVIDER_ORDER_X = "direct,gallery_dl,yt_dlp,external"
MEDIA_FALLBACK_PROVIDER_ORDER_INSTAGRAM = "direct,gallery_dl,instaloader,yt_dlp,external"
MEDIA_GALLERY_DL_ENABLED = "true"
MEDIA_GALLERY_DL_TIMEOUT_SECONDS = "25"
MEDIA_INSTALOADER_ENABLED = "true"
MEDIA_INSTALOADER_TIMEOUT_SECONDS = "30"
MEDIA_VIDEO_OUTPUT_PROFILE = "telegram_review_optimized"
MEDIA_VIDEO_TRANSCODE_POLICY = "copy_if_possible"
MEDIA_MAX_VIDEO_SIDE = "1920"
MEDIA_VIDEO_CRF = "23"
MEDIA_VIDEO_AUDIO_BITRATE = "128k"
# Set these to your internal Telegram cache/staging chat IDs.
# e.g. "-100xxxxxxxxxx" for a private supergroup.
TELEGRAM_MEDIA_STAGING_CHAT_ID = ""
TELEGRAM_MEDIA_STAGING_THREAD_ID = ""
TELEGRAM_MEDIA_CACHE_CHAT_ID = ""
TELEGRAM_MEDIA_CACHE_THREAD_ID = ""
WORDPRESS_REAL_DRY_RUN_ENABLED = "false"
WORDPRESS_DEFAULT_STATUS = "draft"
TELEGRAM_ALLOWED_REVIEWER_IDS = ""

AI_PROVIDER = "mock"
AI_MODEL = "mock"
EXTERNAL_LINK_METADATA_ENABLED = "true"
EXTERNAL_LINK_FETCH_TIMEOUT_MS = "8000"

# Apify autonomous curation pipeline — DISABLED by default in staging.
# Enable only after verifying routes, category sources, and budget config.
# Use APIFY_CURATION_DRY_RUN=true first to test without Claude API calls or publishing.
APIFY_CURATION_ENABLED = "false"
APIFY_CURATION_DRY_RUN = "true"
APIFY_DATASET_ID = ""
APIFY_MAX_ITEMS_PER_RUN = "100"
APIFY_ENABLED_PLATFORMS = "instagram,x,linkedin"

# Claude curation cost control
CLAUDE_CURATION_MODEL = "claude-sonnet-4-20250514"
CLAUDE_CURATION_THRESHOLD_SCORE = "75"
CLAUDE_CURATION_MAX_CANDIDATES_PER_RUN = "50"
CLAUDE_CURATION_MAX_TEXT_CHARS_PER_ITEM = "400"
CLAUDE_CURATION_MAX_CALLS_PER_DAY = "3"
CLAUDE_CURATION_DAILY_TOKEN_BUDGET = "100000"
CLAUDE_CURATION_MAX_OUTPUT_TOKENS = "4096"
CLAUDE_CURATION_MAX_RETRIES = "1"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "your_database_name"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "packages/db/migrations"
